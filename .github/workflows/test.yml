name: Test

on:
  push:
    branches:
      - main
  pull_request:

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

# Only the tip of a branch or pull request is worth testing, so a push that supersedes
# an earlier one cancels its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reading the repository is the only thing this job does with the token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint publishes no first-party action, and the npm builds of it were
      # abandoned in 2022, so the release binary is downloaded and checksum-verified
      # here. Bump the version and the checksum together, from
      # https://github.com/rhysd/actionlint/releases.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          # The matcher turns actionlint's output into inline annotations on the diff.
          echo "::add-matcher::.github/actionlint-matcher.json"
          ./actionlint -color
          echo "::remove-matcher owner=actionlint::"
          rm -f actionlint actionlint.tar.gz

      # Security audit of the workflows themselves — unpinned actions, credential
      # persistence, over-broad permissions. `advanced-security: false` keeps the
      # findings in the job log and its annotations, so the job needs no extra
      # permissions. Suppressions live in .github/zizmor.yml.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          # The strictest persona: it also asks for job names, concurrency limits and a
          # comment on every elevated permission. The repository is clean at this level.
          persona: pedantic

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '26'
          cache: true

      - run: vp install

      # Formatting is the only repo-wide check: a workspace `lint` block is only
      # honoured when it is the root of the run, so lint and type checks are delegated
      # to each workspace by `vp run -r check`.
      - run: vp fmt --check

      # Every text check in one task: Markdown structure, terminology, spelling, secret
      # scanning and link rot. Nothing here needs a build, so it fails fast.
      - run: vp run lint

      - run: vp run -r check

      - run: vp run schema-truth#build

      # Type-check every generated fixture against the real target library, so a
      # generator emitting an API the library does not have fails the build.
      - run: vp run -r typecheck

      # The fixtures assert on the generated files from the repository root config;
      # the library's own suite lives in packages/schema-truth.
      - run: vp test

      - run: vp run schema-truth#test
